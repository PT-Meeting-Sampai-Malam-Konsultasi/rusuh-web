name: Deploy

# Static export to Cloudflare Pages (Direct Upload):
#   pull request → preview on rusuh-web-staging (branch pr-<n>, its own *.pages.dev URL)
#   push to main → staging (rusuh-web-staging, https://rusuh-web-staging.pages.dev)
#   tag v*.*.*   → production (rusuh-web), after a reviewer approves the `production` environment
# NEXT_PUBLIC_* values are baked in at build time, so every environment gets its own build.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write # lets wrangler-action post the deployment link on the PR

jobs:
  deploy:
    # Pull requests from forks get no secrets; ours all come from org members.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      PROJECT: ${{ startsWith(github.ref, 'refs/tags/v') && 'rusuh-web' || 'rusuh-web-staging' }}
      # A deploy on the project's production branch (main) becomes the live site; any other name is a preview.
      BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}
      # Sentry (NFR-09-W1): the release is the tag or commit, as in NEXT_PUBLIC_APP_VERSION.
      RELEASE: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      SENTRY_ENV: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || (github.event_name == 'pull_request' && 'preview' || 'staging') }}
      # Without the secret, no source maps are built or uploaded and the deploy goes on as before.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Public values from the GitHub environment (Settings → Environments); read only in config.ts.
          NEXT_PUBLIC_APP_VERSION: ${{ env.RELEASE }}
          NEXT_PUBLIC_QUEUE_API_URL: ${{ vars.QUEUE_API_URL }}
          NEXT_PUBLIC_CORE_API_URL: ${{ vars.CORE_API_URL }}
          NEXT_PUBLIC_API_TIMEOUT_MS: ${{ vars.API_TIMEOUT_MS }}
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${{ vars.MIDTRANS_CLIENT_KEY }}
          NEXT_PUBLIC_MIDTRANS_SNAP_URL: ${{ vars.MIDTRANS_SNAP_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_DEFAULT_LOCALE: ${{ vars.DEFAULT_LOCALE }}
          NEXT_PUBLIC_API_MOCK: ${{ vars.API_MOCK }}
          # Sentry: an empty DSN turns it off. Rates default to 0.05 (traces) and 0.1 (replay on error) in config.ts.
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ env.SENTRY_ENV }}
          NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_TRACES_SAMPLE_RATE }}
          NEXT_PUBLIC_SENTRY_REPLAY_ON_ERROR_RATE: ${{ vars.SENTRY_REPLAY_ON_ERROR_RATE }}
          # X-Request-ID on API calls; off unless the variable is "true" (needs the API's CORS to allow it).
          NEXT_PUBLIC_REQUEST_ID_HEADER: ${{ vars.REQUEST_ID_HEADER }}
          SOURCE_MAPS: ${{ env.SENTRY_AUTH_TOKEN != '' }}
          # Product analytics and its consent banner; off unless the variable is "true".
          NEXT_PUBLIC_ANALYTICS_ENABLED: ${{ vars.ANALYTICS_ENABLED }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}

      # Readable stack traces in Sentry: tie each chunk to its map (debug IDs), upload the maps under the release,
      # then delete them so the site never serves them.
      - name: Upload source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          npx --yes @sentry/cli@3.8.2 sourcemaps inject out/_next/static
          npx --yes @sentry/cli@3.8.2 sourcemaps upload --release "$RELEASE" out/_next/static
          find out -name '*.map' -delete

      - name: Upload to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ env.PROJECT }} --branch=${{ env.BRANCH }} --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # Lighthouse on the URL just deployed (preview, staging or production). Scores below the targets in
  # lighthouserc.json are warnings for now; the job summary shows the table and links to the full reports.
  lighthouse:
    needs: deploy
    if: needs.deploy.outputs.url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Lighthouse
        id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          # Add pages here as features land, e.g. /order?event=evt_samudra.
          urls: |
            ${{ needs.deploy.outputs.url }}/
          configPath: ./lighthouserc.json
          runs: 3
          # Public report links for 7 days (the pages are public anyway).
          temporaryPublicStorage: true
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          LINKS: ${{ steps.lhci.outputs.links }}
        run: node scripts/lighthouse-summary.mjs >> "$GITHUB_STEP_SUMMARY"

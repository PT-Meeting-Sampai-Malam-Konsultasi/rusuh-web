name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Public placeholder values; real environments set their own NEXT_PUBLIC_* at build time.
      - run: cp .env.example .env.local
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: node scripts/check-bundle-size.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          retention-days: 7

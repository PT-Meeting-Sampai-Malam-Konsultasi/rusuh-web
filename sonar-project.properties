# SonarQube Cloud analysis, run by the CI workflow (Automatic Analysis is off for this project).
sonar.organization=pt-meeting-sampai-malam-konsultasi
sonar.projectKey=PT-Meeting-Sampai-Malam-Konsultasi_rusuh-web
sonar.projectName=rusuh-web

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/__tests__/**,src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/**/__tests__/**,src/**/*.test.ts,src/**/*.test.tsx

# Coverage from `npm run test:coverage`; skip the same files as vitest.config.mts.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/app/**,src/**/*.d.ts,src/**/*.types.ts,src/infrastructure/mocks/browser.ts
